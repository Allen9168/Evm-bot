# 项目启用开关
Enabled : false

# 项目名称(每个项目必填 格式: 链-模式-币名字)
Name : "XX-BurningInvoke-项目"

# 模式 (调用监控模式)
Model : "Burning"

# 购买的合约
Contract : "0x83264d98eb0ec976dadc325a0662bcccf1b39b30"

# 参与的机器人项目组(Main/SoHa)
AccountGroups :
  - "Main"

# 燃烧配置
Burning :
  # Action
  Action : "Invoke"
  # 调用数据
  Invoke :
    # gas价格 (不写则为跟踪模式)
    GasPrice : 5
    # gas数量
    GasCount : 1000000
    # 调用这个数据
    Data : ""
  # 开始区块 会自动提前一个
  # StartBlock : 10679680
  # 开始时间 Unix时间戳
  StartTime : 1647431256
  # 持续时间 秒
  Duration : 30000000
  # 间隔 毫秒为单位 (1000 / 间隔 = 每秒次数)
  
  Delay :
    Interval : 3000