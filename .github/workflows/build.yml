name: Build Binaries

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK 6.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore Soha.csproj

      - name: Publish (${{ matrix.rid }})
        run: |
          dotnet publish Soha.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
            /p:PublishSingleFile=true /p:PublishTrimmed=false
      - name: Upload artifact (${{ matrix.rid }})
        uses: actions/upload-artifact@v4
        with:
          name: Soha-${{ matrix.rid }}
          path: |
            bin/Release/net6.0/${{ matrix.rid }}/publish/**
