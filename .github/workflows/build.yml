name: build-and-release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]
  release:
    types: [ published ]

# 允许发布 release
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64

    env:
      PROJECT: Soha.csproj
      CONFIG: Release
      OUT_DIR: out
      APP_NAME: Soha

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        run: dotnet build ${{ env.PROJECT }} -c ${{ env.CONFIG }} --nologo

      - name: Publish (self-contained single-file)
        run: >
          dotnet publish ${{ env.PROJECT }} -c ${{ env.CONFIG }}
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:PublishTrimmed=false
          -p:AssemblyName=${{ env.APP_NAME }}
          -o ${{ env.OUT_DIR }}/${{ matrix.rid }}/app

      # 复制配置
      - name: Copy Config (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          if [ -d "Config" ]; then
            mkdir -p "${{ env.OUT_DIR }}/${{ matrix.rid }}/app/Config"
            cp -R Config/* "${{ env.OUT_DIR }}/${{ matrix.rid }}/app/Config/" || true
          fi
          chmod +x "${{ env.OUT_DIR }}/${{ matrix.rid }}/app/${{ env.APP_NAME }}"

      - name: Copy Config (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          if (Test-Path "Config") {
            New-Item -ItemType Directory -Force -Path "${{ env.OUT_DIR }}\${{ matrix.rid }}\app\Config" | Out-Null
            Copy-Item -Recurse -Force "Config\*" "${{ env.OUT_DIR }}\${{ matrix.rid }}\app\Config\" -ErrorAction SilentlyContinue
          }

      # 去掉 PDB（可选）
      - name: Strip PDB (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          find "${{ env.OUT_DIR }}/${{ matrix.rid }}/app" -type f -name "*.pdb" -delete || true

      - name: Strip PDB (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          Get-ChildItem -Path "${{ env.OUT_DIR }}\${{ matrix.rid }}\app" -Recurse -Filter *.pdb | Remove-Item -Force -ErrorAction SilentlyContinue

      # 注意：不在构建阶段打包。直接上传展开目录，Artifact 下载即开箱即用
      - name: Upload artifact (Linux dir)
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux-x64
          path: ${{ env.OUT_DIR }}/linux-x64/app
          if-no-files-found: error

      - name: Upload artifact (Windows dir)
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-win-x64
          path: ${{ env.OUT_DIR }}/win-x64/app
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts (flatten names)
        uses: actions/download-artifact@v4
        with:
          pattern: Soha-*
          merge-multiple: false

      - name: Show files
        run: ls -lahR

      - name: Install zip (for Windows packaging on Linux)
        run: sudo apt-get update && sudo apt-get install -y zip

      # 现在在 release 阶段再打最终包（只打一次）
      - name: Pack Linux -> Soha-linux-x64.tar.gz
        run: |
          tar -czf Soha-linux-x64.tar.gz -C "Soha-linux-x64" .

      - name: Pack Windows -> Soha-win-x64.zip
        run: |
          cd "Soha-win-x64"
          zip -r ../Soha-win-x64.zip .
          cd ..

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Soha-linux-x64.tar.gz
            Soha-win-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
