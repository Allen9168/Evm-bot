name: build-and-release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]
  release:
    types: [ published ]

# 必须：允许 GITHUB_TOKEN 写 release，否则会报 "Resource not accessible by integration"
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact_ext: tar.gz
          - os: windows-latest
            rid: win-x64
            artifact_ext: zip

    env:
      PROJECT: Soha.csproj
      CONFIG: Release
      OUT_DIR: out
      APP_NAME: Soha

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        run: dotnet build ${{ env.PROJECT }} -c ${{ env.CONFIG }} --nologo

      # 发布为自包含单文件
      - name: Publish (self-contained single-file)
        run: >
          dotnet publish ${{ env.PROJECT }} -c ${{ env.CONFIG }}
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:PublishTrimmed=false
          -p:AssemblyName=${{ env.APP_NAME }}
          -o ${{ env.OUT_DIR }}/${{ matrix.rid }}/app

      # 复制配置文件到产物
      - name: Copy Config (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          if [ -d "Config" ]; then
            mkdir -p "${{ env.OUT_DIR }}/${{ matrix.rid }}/app/Config"
            cp -R Config/* "${{ env.OUT_DIR }}/${{ matrix.rid }}/app/Config/" || true
          fi
          chmod +x "${{ env.OUT_DIR }}/${{ matrix.rid }}/app/${{ env.APP_NAME }}"

      - name: Copy Config (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          if (Test-Path "Config") {
            New-Item -ItemType Directory -Force -Path "${{ env.OUT_DIR }}\${{ matrix.rid }}\app\Config" | Out-Null
            Copy-Item -Recurse -Force "Config\*" "${{ env.OUT_DIR }}\${{ matrix.rid }}\app\Config\" -ErrorAction SilentlyContinue
          }

      # 打包前移除 PDB（可选）
      - name: Strip PDB (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          find "${{ env.OUT_DIR }}/${{ matrix.rid }}/app" -type f -name "*.pdb" -delete || true

      - name: Strip PDB (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          Get-ChildItem -Path "${{ env.OUT_DIR }}\${{ matrix.rid }}\app" -Recurse -Filter *.pdb | Remove-Item -Force -ErrorAction SilentlyContinue

      # 打包
      - name: Pack Linux
        if: matrix.rid == 'linux-x64'
        run: |
          tar -czf "${{ env.APP_NAME }}-${{ matrix.rid }}.${{ matrix.artifact_ext }}" \
            -C "${{ env.OUT_DIR }}/${{ matrix.rid }}/app" .

      - name: Pack Windows
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ env.OUT_DIR }}\${{ matrix.rid }}\app\*" `
            -DestinationPath "${{ env.APP_NAME }}-${{ matrix.rid }}.${{ matrix.artifact_ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.rid }}
          path: ${{ env.APP_NAME }}-${{ matrix.rid }}.${{ matrix.artifact_ext }}
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts (flatten)
        uses: actions/download-artifact@v4
        with:
          pattern: Soha-*
          merge-multiple: true

      - name: Show files
        run: ls -lah

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Soha-*.tar.gz
            Soha-*.zip
          generate_release_notes: true
          # overwrite: true  # 如需覆盖同名资产可打开
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
