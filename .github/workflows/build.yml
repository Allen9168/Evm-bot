name: build-and-release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  APP_PROJECT: Soha.csproj           # 你的主项目文件
  APP_NAME: Soha                     # 产物名（生成 Soha.exe / Soha）

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ "win-x64", "linux-x64", "linux-arm64" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x

      - name: Restore
        run: dotnet restore "${{ env.APP_PROJECT }}"

      - name: Publish (self-contained single-file)
        run: |
          dotnet publish "${{ env.APP_PROJECT }}" -c Release -r ${{ matrix.rid }} \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false \
            -o "out/${{ matrix.rid }}"

      # 规范化产物文件名（Windows 加 .exe，Linux 无后缀）
      - name: Rename artifact
        shell: bash
        run: |
          OUT="out/${{ matrix.rid }}"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            EXE=$(find "$OUT" -maxdepth 1 -type f -name "*.exe" | head -n1)
            if [[ -z "$EXE" ]]; then echo "No exe found"; exit 1; fi
            mv "$EXE" "$OUT/${{ env.APP_NAME }}.exe"
          else
            BIN=$(find "$OUT" -maxdepth 1 -type f ! -name "*.dll" ! -name "*.pdb" ! -name "*.xml" ! -name "*.json" | head -n1)
            if [[ -z "$BIN" ]]; then
              # dotnet publish 可能输出同名可执行（无后缀），容错处理
              BIN="$OUT/${{ env.APP_NAME }}"
              if [[ ! -f "$BIN" ]]; then
                # fallback: 找到同名主程序
                BIN_CAND=$(find "$OUT" -maxdepth 1 -type f -name "${{ env.APP_NAME }}" -o -name "${{ env.APP_NAME }}.*" | head -n1)
                if [[ -n "$BIN_CAND" ]]; then BIN="$BIN_CAND"; fi
              fi
            fi
            chmod +x "$BIN"
            mv "$BIN" "$OUT/${{ env.APP_NAME }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: evm-bot-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show files
        run: find dist -type f -maxdepth 3 -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            dist/**/*
